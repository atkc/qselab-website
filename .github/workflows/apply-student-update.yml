name: Apply QSE student update

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-student-update.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply verified student update
        shell: bash
        run: |
          set -euo pipefail
          unzip -q qselab-student-update.zip -d "$RUNNER_TEMP/qse-update"
          cp -a "$RUNNER_TEMP/qse-update/." .
          rm qselab-student-update.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add first QSE students and updated group copy"
          git push origin HEAD:main
